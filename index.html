<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>タイマー</title>

<style>
body{
    font-family:sans-serif;
    margin:20px;
}

h2{
    margin-bottom:5px;
}

#dateText{
    margin-bottom:15px;
    font-size:16px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    border:1px solid #999;
    padding:10px;
    text-align:center;
    font-size:16px;
}

button{
    padding:8px 14px;
    margin:2px;
    font-size:14px;
}

.elapsed{
    font-weight:bold;
}

@media print{
    button{
        display:none;
    }

    th:nth-child(3),
    td:nth-child(3){
        display:none;
    }
}
@page{
    size:A4 portrait;
    margin:5mm;
}

@media print{

    body{
        zoom:0.33;
    }

    h2{
        font-size:10px;
        margin:0 0 2px 0;
    }

    #dateText{
        font-size:6px;
        margin-bottom:3px;
    }

    table{
        width:60%;
        border-collapse:collapse;
    }

    th,td{
        padding:1px;
        font-size:5px;
    }

    button{
        display:none;
    }

    th:nth-child(3),
    td:nth-child(3){
        display:none;
    }
}
</style>
</head>

<body>

<h2>計測結果</h2>
<div id="dateText"></div>

<button onclick="printPDF()">PDF作成</button>
<button onclick="resetAll()">オールリセット</button>

<table>
<tr>
    <th>番号</th>
    <th>経過時間</th>
    <th>操作</th>
</tr>

<tbody id="tableBody"></tbody>
</table>

<script>
const tableBody = document.getElementById("tableBody");
const timers = {};

const rows = [
"1","2",
"3","3a",
"4","4a",
"5","5a",
"6","6a",
"7","7a",
"8",
"9","10","11","12"
];

rows.forEach(name => createRow(name));

function setToday(){
    const today = new Date();

    const y = today.getFullYear();
    const m = today.getMonth() + 1;
    const d = today.getDate();

    document.getElementById("dateText").textContent =
        `${y}年${m}月${d}日`;
}

setToday();

function createRow(name){

    const tr = document.createElement("tr");
    tr.dataset.name = name;

    if(name.includes("a")){
        tr.style.backgroundColor = "#f0f8ff";
    }

    tr.innerHTML = `
        <td>${name}</td>
        <td class="elapsed">00:00:00</td>
        <td>
            <button onclick="startTimer('${name}')">Start</button>
            <button onclick="endTimer('${name}')">End</button>
        </td>
    `;

    tableBody.appendChild(tr);
}

function formatTime(ms){

    const totalSeconds = Math.floor(ms / 1000);

    const hours =
        String(Math.floor(totalSeconds / 3600)).padStart(2,"0");

    const minutes =
        String(Math.floor((totalSeconds % 3600) / 60)).padStart(2,"0");

    const seconds =
        String(totalSeconds % 60).padStart(2,"0");

    return `${hours}:${minutes}:${seconds}`;
}

function startTimer(name){

    const row =
        document.querySelector(`tr[data-name="${name}"]`);

    if(timers[name]){
        clearInterval(timers[name].interval);
    }

    const startTime = Date.now();

    timers[name] = {
        startTime:startTime,
        interval:setInterval(()=>{
            const elapsed = Date.now() - startTime;

            row.querySelector(".elapsed").textContent =
                formatTime(elapsed);

        },1000)
    };
}

function endTimer(name){

    if(!timers[name]) return;

    clearInterval(timers[name].interval);

    const row =
        document.querySelector(`tr[data-name="${name}"]`);

    row.style.backgroundColor = "#d9f7d9";

    delete timers[name];
}

function resetAll(){

    if(!confirm("すべての記録を消しますか？")){
        return;
    }

    for(const name in timers){
        clearInterval(timers[name].interval);
        delete timers[name];
    }

    document.querySelectorAll(".elapsed").forEach(cell => {
        cell.textContent = "00:00:00";
    });
}

function printPDF(){
    window.print();
}
</script>

</body>
</html>
