<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>タイマー</title>

<style>
body {
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  margin: 0;
  padding: 20px;
  background: #f5f5f5;
  color: #111;
}

h1 {
  font-size: 28px;
  margin: 0 0 16px;
  text-align: center;
}

.wrap {
  max-width: 980px;
  margin: 0 auto;
  background: white;
  border-radius: 14px;
  overflow: hidden;
  box-shadow: 0 4px 16px rgba(0,0,0,0.12);
}

.topControls, .bottomTabs, .resultControls {
  display: flex;
  gap: 10px;
  justify-content: center;
  padding: 12px;
  background: #fafafa;
  flex-wrap: wrap;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 22px;
}

th, td {
  border-bottom: 1px solid #ccc;
  padding: 12px 10px;
  text-align: left;
  vertical-align: middle;
}

th {
  background: #fafafa;
  font-weight: 700;
}

td:first-child, th:first-child {
  width: 70px;
  text-align: center;
}

button {
  font-size: 20px;
  padding: 10px 16px;
  border: none;
  border-radius: 10px;
  color: white;
  min-width: 105px;
  touch-action: manipulation;
}

.start { background: #007aff; }
.stop { background: #ff3b30; }
.done { background: #34c759; }
.smallButton { background: #555; font-size: 18px; min-width: 130px; }
.pdfButton { background: #007aff; }
.backButton { background: #555; }
.copyButton { background: #34c759; }
.activeTab { background: #007aff; }
.inactiveTab { background: #999; }

.disabledButton {
  opacity: 0.75;
}

.disabledCell {
  background: #d6d6d6;
}

#resultScreen {
  display: none;
}

.resultBox {
  max-width: 900px;
  margin: 0 auto;
  background: white;
  padding: 18px;
  border-radius: 14px;
}

.nameInput {
  width: 65%;
  font-size: 20px;
  padding: 8px;
  box-sizing: border-box;
  border: 1px solid #aaa;
  border-radius: 6px;
}

#copyText {
  white-space: pre-wrap;
  font-size: 20px;
  line-height: 1.6;
  border: 1px solid #ccc;
  padding: 12px;
  margin-top: 14px;
  background: #fafafa;
}

@media print {
  body { background: white; }
  .resultControls { display: none; }
  #timerScreen { display: none; }
  #resultScreen { display: block; }
  .resultBox { box-shadow: none; border-radius: 0; }
  input { border: none; }
}

@media (max-width: 760px) {
  body { padding: 8px; }
  h1 { font-size: 23px; }
  table { font-size: 17px; }
  th, td { padding: 8px 4px; }

  button {
    font-size: 16px;
    min-width: 68px;
    padding: 8px 5px;
    border-radius: 8px;
  }

  .smallButton {
    font-size: 16px;
    min-width: 110px;
  }

  .nameInput {
    font-size: 17px;
    padding: 6px;
  }
}
</style>
</head>

<body>

<div id="timerScreen">
  <h1>タイマー</h1>

  <div class="wrap">

    <div class="topControls">
      <button class="smallButton" onclick="resetAll()">全リセット</button>
      <button class="smallButton pdfButton" onclick="showPdfScreen()">PDF表示</button>
    </div>

    <table>
      <thead>
        <tr>
          <th>番号</th>
          <th>時間</th>
          <th>操作</th>
          <th>助言</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="timerBody"></tbody>
    </table>

    <div class="bottomTabs">
      <button id="tab6" class="activeTab" onclick="setAdviceLimit(6)">助言6番まで</button>
      <button id="tab7" class="inactiveTab" onclick="setAdviceLimit(7)">助言7番まで</button>
    </div>

  </div>
</div>

<div id="resultScreen">
  <div class="resultBox">

    <div class="resultControls">
      <button class="backButton" onclick="backToTimer()">戻る</button>
      <button class="pdfButton" onclick="window.print()">PDFにする</button>
      <button class="copyButton" onclick="copyPdfText()">表示内容をコピー</button>
    </div>

    <h1>計測結果</h1>
    <div id="resultArea"></div>
    <div id="copyText"></div>

  </div>
</div>

<script>
const COUNT = 10;
const timers = [];
const tbody = document.getElementById("timerBody");

let adviceLimit = 6;

function formatTime(ms) {
  const totalSeconds = Math.floor(ms / 1000);
  const minutes = Math.floor(totalSeconds / 60);
  const seconds = totalSeconds % 60;
  return `${minutes}:${String(seconds).padStart(2, "0")}`;
}

function canUseAdvice(index) {
  const number = index + 1;
  return number >= 3 && number <= adviceLimit;
}

function saveData() {
  const data = {
    adviceLimit: adviceLimit,
    records: timers.map(t => ({
      mainTime: t.mainTime,
      adviceTime: t.adviceTime,
      studentName: t.studentName || ""
    }))
  };
  localStorage.setItem("multiTimerRecords", JSON.stringify(data));
}

function loadData() {
  const saved = localStorage.getItem("multiTimerRecords");
  const parsed = saved ? JSON.parse(saved) : {};
  const records = parsed.records || [];

  adviceLimit = parsed.adviceLimit || 6;

  for (let i = 0; i < COUNT; i++) {
    timers.push({
      number: i + 1,

      mainStart: null,
      mainInterval: null,
      mainTime: records[i]?.mainTime || "-",
      mainRunning: false,

      adviceStart: null,
      adviceInterval: null,
      adviceTime: records[i]?.adviceTime || "-",
      adviceRunning: false,

      studentName: records[i]?.studentName || ""
    });
  }
}

function makeButton(text, className, onClick) {
  const button = document.createElement("button");
  button.textContent = text;
  button.className = className;
  button.onclick = onClick;
  return button;
}

function renderTabs() {
  document.getElementById("tab6").className =
    adviceLimit === 6 ? "activeTab" : "inactiveTab";

  document.getElementById("tab7").className =
    adviceLimit === 7 ? "activeTab" : "inactiveTab";
}

function setAdviceLimit(limit) {
  adviceLimit = limit;
  saveData();
  render();
  renderTabs();
}

function render() {
  tbody.innerHTML = "";

  timers.forEach((timer, index) => {
    const tr = document.createElement("tr");

    const numberTd = document.createElement("td");
    numberTd.textContent = timer.number;

    const mainTimeTd = document.createElement("td");
    mainTimeTd.id = `main-time-${index}`;
    mainTimeTd.textContent = timer.mainTime;

    const mainButtonTd = document.createElement("td");

    let mainButtonText = "start";
    let mainButtonClass = "start";

    if (timer.mainRunning) {
      mainButtonText = "stop";
      mainButtonClass = "stop";
    } else if (timer.mainTime !== "-") {
      mainButtonText = "記録済み";
      mainButtonClass = "done disabledButton";
    }

    const mainButton = makeButton(mainButtonText, mainButtonClass, () => toggleMainTimer(index));
    mainButton.id = `main-button-${index}`;

    if (timer.mainTime !== "-" && !timer.mainRunning) {
      mainButton.disabled = true;
    }

    mainButtonTd.appendChild(mainButton);

    const adviceTimeTd = document.createElement("td");
    adviceTimeTd.id = `advice-time-${index}`;

    const adviceButtonTd = document.createElement("td");

    if (canUseAdvice(index)) {
      adviceTimeTd.textContent = timer.adviceTime;

      let adviceButtonText = "start";
      let adviceButtonClass = "start";

      if (timer.adviceRunning) {
        adviceButtonText = "stop";
        adviceButtonClass = "stop";
      } else if (timer.adviceTime !== "-") {
        adviceButtonText = "記録済み";
        adviceButtonClass = "done disabledButton";
      }

      const adviceButton = makeButton(adviceButtonText, adviceButtonClass, () => toggleAdviceTimer(index));
      adviceButton.id = `advice-button-${index}`;

      if (timer.adviceTime !== "-" && !timer.adviceRunning) {
        adviceButton.disabled = true;
      }

      adviceButtonTd.appendChild(adviceButton);
    } else {
      adviceTimeTd.textContent = "";
      adviceTimeTd.className = "disabledCell";
      adviceButtonTd.className = "disabledCell";
    }

    tr.appendChild(numberTd);
    tr.appendChild(mainTimeTd);
    tr.appendChild(mainButtonTd);
    tr.appendChild(adviceTimeTd);
    tr.appendChild(adviceButtonTd);

    tbody.appendChild(tr);
  });

  renderTabs();
}

function toggleMainTimer(index) {
  const timer = timers[index];

  if (timer.mainTime !== "-" && !timer.mainRunning) return;

  const timeCell = document.getElementById(`main-time-${index}`);
  const button = document.getElementById(`main-button-${index}`);

  if (!timer.mainRunning) {
    timer.mainStart = Date.now();
    timer.mainRunning = true;
    timer.mainTime = "-";

    button.textContent = "stop";
    button.className = "stop";
    timeCell.textContent = "0:00";

    timer.mainInterval = setInterval(() => {
      timeCell.textContent = formatTime(Date.now() - timer.mainStart);
    }, 200);

  } else {
    clearInterval(timer.mainInterval);

    timer.mainTime = formatTime(Date.now() - timer.mainStart);
    timer.mainRunning = false;
    timer.mainStart = null;
    timer.mainInterval = null;

    timeCell.textContent = timer.mainTime;
    button.textContent = "記録済み";
    button.className = "done disabledButton";
    button.disabled = true;

    saveData();
  }
}

function toggleAdviceTimer(index) {
  if (!canUseAdvice(index)) return;

  const timer = timers[index];

  if (timer.adviceTime !== "-" && !timer.adviceRunning) return;

  const timeCell = document.getElementById(`advice-time-${index}`);
  const button = document.getElementById(`advice-button-${index}`);

  if (!timer.adviceRunning) {
    timer.adviceStart = Date.now();
    timer.adviceRunning = true;
    timer.adviceTime = "-";

    button.textContent = "stop";
    button.className = "stop";
    timeCell.textContent = "0:00";

    timer.adviceInterval = setInterval(() => {
      timeCell.textContent = formatTime(Date.now() - timer.adviceStart);
    }, 200);

  } else {
    clearInterval(timer.adviceInterval);

    timer.adviceTime = formatTime(Date.now() - timer.adviceStart);
    timer.adviceRunning = false;
    timer.adviceStart = null;
    timer.adviceInterval = null;

    timeCell.textContent = timer.adviceTime;
    button.textContent = "記録済み";
    button.className = "done disabledButton";
    button.disabled = true;

    saveData();
  }
}

function resetAll() {
  if (!confirm("すべての記録を消しますか？")) return;

  timers.forEach(timer => {
    if (timer.mainInterval) clearInterval(timer.mainInterval);
    if (timer.adviceInterval) clearInterval(timer.adviceInterval);

    timer.mainStart = null;
    timer.mainInterval = null;
    timer.mainTime = "-";
    timer.mainRunning = false;

    timer.adviceStart = null;
    timer.adviceInterval = null;
    timer.adviceTime = "-";
    timer.adviceRunning = false;

    timer.studentName = "";
  });

  saveData();
  render();
}

function makeResultText() {
  let text = "";
  text += "計測結果\n\n";
  text += "番号\t名前\t時間\t助言\n";

  timers.forEach(t => {
    text += `${t.number}\t${t.studentName || ""}\t${t.mainTime}\t${canUseAdvice(t.number - 1) ? t.adviceTime : ""}\n`;
  });

  return text;
}

function showPdfScreen() {
  const resultArea = document.getElementById("resultArea");
  const copyText = document.getElementById("copyText");

  let html = "";
  html += `<table>`;
  html += `<tr><th>番号</th><th>名前</th><th>時間</th><th>助言</th></tr>`;

  timers.forEach((t, index) => {
    html += `<tr>`;
    html += `<td>${t.number}</td>`;
    html += `<td><input class="nameInput" value="${t.studentName || ""}" oninput="updateName(${index}, this.value)"></td>`;
    html += `<td>${t.mainTime}</td>`;
    html += `<td>${canUseAdvice(index) ? t.adviceTime : ""}</td>`;
    html += `</tr>`;
  });

  html += `</table>`;

  resultArea.innerHTML = html;
  copyText.textContent = makeResultText();

  document.getElementById("timerScreen").style.display = "none";
  document.getElementById("resultScreen").style.display = "block";
}

function updateName(index, value) {
  timers[index].studentName = value;
  saveData();
  document.getElementById("copyText").textContent = makeResultText();
}

function backToTimer() {
  document.getElementById("resultScreen").style.display = "none";
  document.getElementById("timerScreen").style.display = "block";
}

function copyPdfText() {
  const text = makeResultText();

  navigator.clipboard.writeText(text).then(() => {
    alert("表示内容をコピーしました。LINEやメールに貼り付けできます。");
  }).catch(() => {
    alert(text);
  });
}

loadData();
render();
</script>

</body>
</html>
