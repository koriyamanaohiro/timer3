<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>タイマー</title>

<style>
body{
    font-family:sans-serif;
    margin:20px;
}

h2{
    margin-bottom:5px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    border:1px solid #999;
    padding:10px;
    text-align:center;
    font-size:16px;
}

button{
    padding:8px 14px;
    margin:2px;
    font-size:14px;
}

.elapsed{
    font-weight:bold;
}
</style>
</head>

<body>

<h2>タイマー</h2>

<button onclick="showPDFView()">PDF用表示</button>
<button onclick="resetAll()">オールリセット</button>

<table>
<tr>
    <th>番号</th>
    <th>経過時間</th>
    <th>操作</th>
</tr>

<tbody id="tableBody"></tbody>
</table>

<script>
const tableBody = document.getElementById("tableBody");
const timers = {};

const rows = [
"1","2",
"3","3a",
"4","4a",
"5","5a",
"6","6a",
"7","7a",
"8",
"9","10","11","12"
];

rows.forEach(name => createRow(name));

function createRow(name){

    const tr = document.createElement("tr");
    tr.dataset.name = name;

    if(name.includes("a")){
        tr.style.backgroundColor = "#f0f8ff";
    }

    tr.innerHTML = `
        <td>${name}</td>
        <td class="elapsed">00:00:00</td>
        <td>
            <button onclick="startTimer('${name}')">Start</button>
            <button onclick="endTimer('${name}')">End</button>
        </td>
    `;

    tableBody.appendChild(tr);
}

function formatTime(ms){

    const totalSeconds = Math.floor(ms / 1000);

    const hours =
        String(Math.floor(totalSeconds / 3600)).padStart(2,"0");

    const minutes =
        String(Math.floor((totalSeconds % 3600) / 60)).padStart(2,"0");

    const seconds =
        String(totalSeconds % 60).padStart(2,"0");

    return `${hours}:${minutes}:${seconds}`;
}

function startTimer(name){

    const row = document.querySelector(`tr[data-name="${name}"]`);

    if(timers[name]){
        clearInterval(timers[name].interval);
    }

    row.style.backgroundColor = name.includes("a") ? "#f0f8ff" : "";

    const startTime = Date.now();

    timers[name] = {
        startTime:startTime,
        interval:setInterval(()=>{
            const elapsed = Date.now() - startTime;

            row.querySelector(".elapsed").textContent =
                formatTime(elapsed);

        },1000)
    };
}

function endTimer(name){

    if(!timers[name]) return;

    clearInterval(timers[name].interval);

    const row = document.querySelector(`tr[data-name="${name}"]`);
    row.style.backgroundColor = "#d9f7d9";

    delete timers[name];
}

function resetAll(){

    if(!confirm("すべての記録を消しますか？")){
        return;
    }

    for(const name in timers){
        clearInterval(timers[name].interval);
        delete timers[name];
    }

    document.querySelectorAll("tr[data-name]").forEach(row => {
        const name = row.dataset.name;

        row.querySelector(".elapsed").textContent = "00:00:00";
        row.style.backgroundColor = name.includes("a") ? "#f0f8ff" : "";
    });
}

function getTodayText(){
    const today = new Date();
    return `${today.getFullYear()}年${today.getMonth()+1}月${today.getDate()}日`;
}

function showPDFView(){

    let tableRows = "";

    rows.forEach(name => {
        const row = document.querySelector(`tr[data-name="${name}"]`);
        const time = row.querySelector(".elapsed").textContent;

        tableRows += `
            <tr>
                <td>${name}</td>
                <td>${time}</td>
            </tr>
        `;
    });

    const pdfHTML = `
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>計測結果</title>

<style>
body{
    font-family:sans-serif;
    margin:16px;
}

h1{
    font-size:22px;
    margin:0 0 6px 0;
}

#date{
    font-size:15px;
    margin-bottom:12px;
}

table{
    width:320px;
    border-collapse:collapse;
}

th,td{
    border:1px solid #777;
    padding:5px;
    text-align:center;
    font-size:14px;
}

th{
    background:#f0f0f0;
}

button{
    margin-bottom:12px;
    padding:8px 14px;
    font-size:14px;
}

@media print{
    button{
        display:none;
    }

    body{
        margin:10mm;
    }

    table{
        width:320px;
    }
}
</style>
</head>

<body>

<button onclick="window.print()">PDFにする</button>

<h1>計測結果</h1>
<div id="date">${getTodayText()}</div>

<table>
<tr>
    <th>番号</th>
    <th>経過時間</th>
</tr>
${tableRows}
</table>

</body>
</html>
`;

    const win = window.open("", "_blank");
    win.document.open();
    win.document.write(pdfHTML);
    win.document.close();
}
</script>

</body>
</html>
